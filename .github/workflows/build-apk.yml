name: Build Debug APK

# Builds an installable debug APK on every push so you can
# download it from the Actions tab straight to your phone.
# Debug APKs are auto-signed by Gradle — no keystore needed.

on:
  push:
    branches:
      - feat/sim-wifi-and-chart-pro
      - tmp/ci-apk-build
    paths-ignore:
      - '**.md'
      - 'tasks/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (SDK tools need 17; Gradle 7.4 + AGP 7.3.1 run on it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 12.0 = JDK-friendly cmdline-tools; default `tools` package is obsolete
          cmdline-tools-version: 11076708
          packages: platform-tools

      - name: Install platform, build-tools and NDK (jni/ needs ndk-build)
        run: |
          sdkmanager --licenses > /dev/null <<<'y
          y
          y
          y
          y
          y
          y
          y
          '
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Summarize APK
        if: always()
        run: |
          echo "## APK build" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/ >> "$GITHUB_STEP_SUMMARY" || echo "no APK produced" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: datamonitor-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
